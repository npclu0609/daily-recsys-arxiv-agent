name: Daily paper digest

on:
  schedule:
    - cron: "0 0 * * *" # 08:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch, summarize, and push
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m daily_paper_agent --config config.yaml

      - name: Persist deduplication state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_papers.json
          git diff --cached --quiet || git commit -m "chore: update sent paper history"
          git push

